<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>TRONG_MCB</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18213f"/>
      <stop offset="1" stop-color="#090d1a"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#2a3a7a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2a3a7a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sfondo -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="282" r="230" fill="url(#halo)"/>

  <g transform="translate(256 266) scale(1.3) translate(-256 -237.5)">
  <!-- Campo triangolare: un lato per giocatore -->
  <g stroke-linecap="round" stroke-width="13" fill="none" opacity="0.7">
    <line x1="108.8" y1="365" x2="403.2" y2="365" stroke="#40d9f2"/>
    <line x1="403.2" y1="365" x2="256"   y2="110" stroke="#ff8c33"/>
    <line x1="256"   y1="110" x2="108.8" y2="365" stroke="#c58bff"/>
  </g>

  <!-- Racchette -->
  <g stroke-linecap="round" stroke-width="26" filter="url(#glow)">
    <line x1="236" y1="341" x2="324" y2="341" stroke="#40d9f2"/>
    <line x1="305" y1="235" x2="349" y2="311" stroke="#ff8c33"/>
    <line x1="207" y1="235" x2="163" y2="311" stroke="#c58bff"/>
  </g>

  <!-- Pallina con scia -->
  <circle cx="246" cy="306" r="9"  fill="#ffffff" opacity="0.18"/>
  <circle cx="256" cy="283" r="13" fill="#ffffff" opacity="0.35"/>
  <circle cx="268" cy="255" r="20" fill="#ffffff" filter="url(#glow)"/>
  </g>
</svg>
