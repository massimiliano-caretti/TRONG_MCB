<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Physiology — what happens in one frame</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8c99b8"/></marker>
  </defs>
  <rect width="1200" height="560" rx="24" fill="#0d1221"/>
  <text x="40" y="58" fill="#e6ebf7" font-size="28" font-weight="800">Physiology — one frame, three roles</text>
  <text x="40" y="88" fill="#8c99b8" font-size="16">frame(now) runs on every display refresh (requestAnimationFrame). dt = min(elapsed, 1/30 s), so a stalled tab never teleports the ball.</text>

  <g font-size="14">
    <!-- start -->
    <rect x="40" y="240" width="170" height="70" rx="35" fill="#1d2747" stroke="#e6ebf7" stroke-width="2"/>
    <text x="125" y="270" text-anchor="middle" fill="#e6ebf7" font-weight="700">frame(now)</text>
    <text x="125" y="292" text-anchor="middle" fill="#8c99b8" font-size="12">≈ 60–120 × per second</text>

    <path d="M210 275 L 250 275" stroke="#8c99b8" stroke-width="2" marker-end="url(#a)"/>
    <polygon points="320,225 390,275 320,325 250,275" fill="#161d33" stroke="#8c99b8" stroke-width="2"/>
    <text x="320" y="280" text-anchor="middle" fill="#e6ebf7" font-weight="700">mode?</text>

    <!-- branches -->
    <path d="M320 225 L 320 160 L 420 160" fill="none" stroke="#40d9f2" stroke-width="2" marker-end="url(#a)"/>
    <text x="330" y="150" fill="#40d9f2" font-size="13" font-weight="700">solo · host</text>
    <path d="M390 275 L 420 275" fill="none" stroke="#ff8c33" stroke-width="2" marker-end="url(#a)"/>
    <path d="M320 325 L 320 400 L 420 400" fill="none" stroke="#c58bff" stroke-width="2" marker-end="url(#a)"/>
    <text x="330" y="420" fill="#c58bff" font-size="13" font-weight="700">guest</text>
    

    <!-- solo / host lane -->
    <rect x="420" y="128" width="148" height="64" rx="12" fill="#161d33" stroke="#40d9f2" stroke-width="2"/>
    <text x="494" y="155" text-anchor="middle" fill="#e6ebf7" font-weight="700">my paddle</text>
    <text x="494" y="175" text-anchor="middle" fill="#8c99b8" font-size="12">finger or keyboard</text>
    <path d="M568 160 L 592 160" stroke="#8c99b8" stroke-width="2" marker-end="url(#a)"/>
    <rect x="592" y="112" width="210" height="96" rx="12" fill="#161d33" stroke="#40d9f2" stroke-width="2"/>
    <text x="697" y="138" text-anchor="middle" fill="#e6ebf7" font-weight="700">simulate(dt)</text>
    <text x="608" y="160" fill="#8c99b8" font-size="12">• CPU seats move (330 u/s)</text>
    <text x="608" y="178" fill="#8c99b8" font-size="12">• countdown → serve()</text>
    <text x="608" y="196" fill="#8c99b8" font-size="12">• stepBall: n sub-steps ≤ 4 u each</text>
    <path d="M802 160 L 826 160" stroke="#8c99b8" stroke-width="2" marker-end="url(#a)"/>
    <rect x="826" y="112" width="186" height="96" rx="12" fill="#161d33" stroke="#ff8c33" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="919" y="138" text-anchor="middle" fill="#ff8c33" font-weight="700">host only</text>
    <text x="842" y="160" fill="#8c99b8" font-size="12">• snapshot → guests</text>
    <text x="842" y="178" fill="#8c99b8" font-size="12">   every 20 ms (50 Hz)</text>
    <text x="842" y="196" fill="#8c99b8" font-size="12">• silent guest 6 s → CPU</text>

    <!-- menu lane -->
    <rect x="420" y="250" width="592" height="50" rx="12" fill="#161d33" stroke="#334061" stroke-width="2"/>
    <text x="716" y="280" text-anchor="middle" fill="#8c99b8">menu: nothing simulated — only the empty field is drawn behind the DOM panels</text>

    <!-- guest lane -->
    <rect x="420" y="368" width="148" height="64" rx="12" fill="#161d33" stroke="#c58bff" stroke-width="2"/>
    <text x="494" y="395" text-anchor="middle" fill="#e6ebf7" font-weight="700">my paddle</text>
    <text x="494" y="415" text-anchor="middle" fill="#8c99b8" font-size="12">local, no wait for host</text>
    <path d="M568 400 L 592 400" stroke="#8c99b8" stroke-width="2" marker-end="url(#a)"/>
    <rect x="592" y="352" width="210" height="96" rx="12" fill="#161d33" stroke="#c58bff" stroke-width="2"/>
    <text x="697" y="378" text-anchor="middle" fill="#e6ebf7" font-weight="700">dead reckoning</text>
    <text x="608" y="400" fill="#8c99b8" font-size="12">ball += velocity · dt</text>
    <text x="608" y="418" fill="#8c99b8" font-size="12">until the next host snapshot</text>
    <text x="608" y="436" fill="#8c99b8" font-size="12">overwrites it (no physics here)</text>
    <path d="M802 400 L 826 400" stroke="#8c99b8" stroke-width="2" marker-end="url(#a)"/>
    <rect x="826" y="352" width="186" height="96" rx="12" fill="#161d33" stroke="#ff8c33" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="919" y="378" text-anchor="middle" fill="#ff8c33" font-weight="700">to host</text>
    <text x="842" y="400" fill="#8c99b8" font-size="12">• paddle position</text>
    <text x="842" y="418" fill="#8c99b8" font-size="12">   every 20 ms (50 Hz)</text>
    <text x="842" y="436" fill="#8c99b8" font-size="12">• silent host 6 s → menu</text>

    <!-- merge to draw -->
    <path d="M1012 160 L 1060 160 L 1060 245" fill="none" stroke="#8c99b8" stroke-width="2"/>
    <path d="M1012 275 L 1040 275" fill="none" stroke="#8c99b8" stroke-width="2"/>
    <path d="M1012 400 L 1060 400 L 1060 305" fill="none" stroke="#8c99b8" stroke-width="2"/>
    <rect x="1040" y="245" width="130" height="60" rx="12" fill="#1d2747" stroke="#e6ebf7" stroke-width="2"/>
    <text x="1105" y="272" text-anchor="middle" fill="#e6ebf7" font-weight="700">draw()</text>
    <text x="1105" y="291" text-anchor="middle" fill="#8c99b8" font-size="12">field rotated to me</text>
  </g>

  <g font-size="14" fill="#8c99b8">
    <rect x="40" y="476" width="1120" height="56" rx="12" fill="#161d33" stroke="#334061"/>
    <text x="60" y="510">Consequence: the host is the single source of truth. A guest's screen may lag the host by one network round-trip; collisions, lives and wins are decided only on the host.</text>
  </g>
</svg>
